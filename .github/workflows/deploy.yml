name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy MindStrong Universe
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve Railway token
        id: token
        shell: bash
        env:
          TOKEN_PRIMARY: ${{ secrets.RAILWAY_TOKEN }}
          TOKEN_FALLBACK: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          TOKEN="${TOKEN_PRIMARY:-$TOKEN_FALLBACK}"
          if [ -z "$TOKEN" ]; then
            echo "❌ Missing Railway token. Set RAILWAY_TOKEN (or RAILWAY_API_TOKEN) in repository secrets."
            echo "❌ Missing Railway token. Set RAILWAY_TOKEN (or RAILWAY_API_TOKEN) in repository secrets. Use a Railway personal token or project token with deploy access."
            exit 1
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Resolve Railway service target
        id: service
        shell: bash
        env:
          SERVICE_NAME: ${{ secrets.RAILWAY_SERVICE }}
          SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          SERVICE="${SERVICE_NAME:-$SERVICE_ID}"
          if [ -z "$SERVICE" ]; then
            SERVICE="mindstrong-universe-site"
            echo "⚠️ RAILWAY_SERVICE/RAILWAY_SERVICE_ID not set. Falling back to '$SERVICE'."
          fi
          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "Using Railway service target: $SERVICE"

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ steps.token.outputs.token }}
          RAILWAY_SERVICE_TARGET: ${{ steps.service.outputs.service }}
        run: railway up --service "$RAILWAY_SERVICE_TARGET" --detach
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ steps.token.outputs.token }}
        run: railway up --service mindstrong-universe-site --detach

      - name: Deployment summary
        run: |
          echo "✅ MindStrong Universe deployed to Railway"
          echo "🔗 https://mindstrong-universe-school-production.up.railway.app"
